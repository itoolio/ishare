name: CI

on:
    pull_request:
    push:
        branches: [dev]
    workflow_call:
    workflow_dispatch:
        inputs:
            record_snapshots:
                description: Record the snapshot test references on the macOS runner and commit them to dev
                type: boolean
                default: false

concurrency:
    group: ci-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

defaults:
    run:
        shell: bash

jobs:
    tools:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - run: go vet ./tools/...
            - run: go test ./tools/...
            - name: Check that the string catalogs round-trip through merge-translations
              run: |
                  for catalog in ishare/Localizable.xcstrings fastlane/metadata/Metadata.xcstrings; do
                      go run ./tools/cmd/ishare-tools merge-translations "$catalog" "$catalog" "$RUNNER_TEMP/roundtrip.xcstrings"
                      cmp "$catalog" "$RUNNER_TEMP/roundtrip.xcstrings"
                  done
            - name: Check that the localized App Store metadata matches its catalog
              run: go run ./tools/cmd/ishare-tools metadata --check

    app:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Build the App Store target
              run: |
                  xcodebuild build \
                    -project ishare.xcodeproj \
                    -scheme ishare \
                    -configuration Release \
                    -destination "generic/platform=macOS" \
                    CODE_SIGNING_ALLOWED=NO | xcbeautify
            - name: Run unit tests
              run: |
                  xcodebuild test \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -destination "platform=macOS" \
                    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= | xcbeautify
            - name: Collect the snapshot renderings that differ from their references
              if: failure()
              run: |
                  FAILURES="$(getconf DARWIN_USER_TEMP_DIR)ishare-snapshot-failures"
                  mkdir -p build/snapshot-failures
                  if [ -d "$FAILURES" ]; then cp -R "$FAILURES/." build/snapshot-failures/; fi
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: snapshot-failures
                  path: build/snapshot-failures
                  if-no-files-found: ignore

    record-snapshots:
        if: github.event_name == 'workflow_dispatch' && inputs.record_snapshots
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: dev
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Find the snapshot folder of this macOS version
              id: os
              run: echo "folder=macOS$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
            - name: Record the snapshot references
              env:
                  TEST_RUNNER_ISHARE_RECORD_SNAPSHOTS: "1"
              run: |
                  rm -rf "ishareTests/Snapshots/${{ steps.os.outputs.folder }}"
                  xcodebuild test \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -destination "platform=macOS" \
                    -only-testing:ishareTests/SnapshotTests \
                    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= | xcbeautify
            - name: Check the recorded references
              env:
                  FOLDER: ishareTests/Snapshots/${{ steps.os.outputs.folder }}
              run: |
                  COUNT=$(find "$FOLDER" -name '*.png' | wc -l | tr -d ' ')
                  echo "Recorded $COUNT references in $FOLDER"
                  test "$COUNT" -gt 0
            - name: Verify the references against a second rendering
              run: |
                  xcodebuild test \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -destination "platform=macOS" \
                    -only-testing:ishareTests/SnapshotTests \
                    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= | xcbeautify
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: snapshot-references
                  path: ishareTests/Snapshots/${{ steps.os.outputs.folder }}
            - name: Commit the references to dev
              env:
                  FOLDER: ishareTests/Snapshots/${{ steps.os.outputs.folder }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "$FOLDER"
                  if git diff --cached --quiet; then
                      echo "The snapshot references did not change."
                      exit 0
                  fi
                  git commit -q -m "test: record the ${{ steps.os.outputs.folder }} snapshot references"
                  git fetch -q origin dev
                  git rebase -q origin/dev
                  git push -q origin HEAD:dev

    app-store-tests:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Run the unit tests inside the sandboxed App Store app
              run: |
                  xcodebuild test \
                    -project ishare.xcodeproj \
                    -scheme AppStoreTests \
                    -destination "platform=macOS" \
                    -derivedDataPath build/DerivedData \
                    -resultBundlePath build/AppStoreTests.xcresult \
                    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
                    ISHARE_APP_STORE_ENTITLEMENTS=ishareTests/SandboxedTestHost.entitlements | xcbeautify
            - name: Check that the test host really was sandboxed
              run: codesign -d --entitlements - --xml build/DerivedData/Build/Products/Debug/ishare.app | grep -q com.apple.security.app-sandbox
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: app-store-tests-xcresult
                  path: build/AppStoreTests.xcresult

    ui-tests:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Run the menu and editor UI tests
              run: |
                  xcodebuild test \
                    -project ishare.xcodeproj \
                    -scheme UITests \
                    -destination "platform=macOS" \
                    -derivedDataPath build/DerivedData \
                    -resultBundlePath build/UITests.xcresult \
                    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= | xcbeautify
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: ui-tests-xcresult
                  path: build/UITests.xcresult
