name: Dependabot auto-merge

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [dev]

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'itoolio/ishare'
        runs-on: ubuntu-24.04
        steps:
            - name: Read the update metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Squash-merge minor and patch updates once the required checks pass
              if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --squash --delete-branch "$PR_URL"
            - name: Leave major updates for review
              if: steps.metadata.outputs.update-type == 'version-update:semver-major'
              env:
                  DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
              run: echo "::notice title=Major update::$DEPENDENCIES needs a manual review before merging."
