name: Website

on:
    push:
        branches: [main]
        paths:
            - "website/**"
            - "examples/**"
            - "CHANGELOG.md"
            - ".github/workflows/pages.yml"
    workflow_dispatch:
    workflow_call:
        inputs:
            appcast-artifact:
                type: string
                default: ""

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
              working-directory: website
            - run: npm run build
              working-directory: website
            - name: Download the new appcast
              if: inputs.appcast-artifact != ''
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.appcast-artifact }}
                  path: website/dist
            - name: Keep the published appcast
              if: inputs.appcast-artifact == ''
              run: |
                  curl -fsSL -o website/dist/appcast.xml https://ishare.itoolio.dev/appcast.xml \
                    || echo "No published appcast yet"
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
