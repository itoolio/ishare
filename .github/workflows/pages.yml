name: Website

on:
    push:
        branches: [main]
        paths:
            - "website/**"
            - "examples/**"
            - "ishare/ishare.docc/**"
            - "CHANGELOG.md"
            - ".github/workflows/pages.yml"
    workflow_dispatch:
    workflow_call:
        inputs:
            appcast-artifact:
                type: string
                default: ""

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    documentation:
        runs-on: macos-26
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Extract the symbol graph
              shell: bash
              run: |
                  mkdir -p build/raw-symbol-graphs
                  xcodebuild build \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -destination "generic/platform=macOS" \
                    -derivedDataPath build/DerivedData \
                    CODE_SIGNING_ALLOWED=NO \
                    "OTHER_SWIFT_FLAGS=\$(inherited) -emit-symbol-graph -emit-symbol-graph-dir $PWD/build/raw-symbol-graphs -symbol-graph-minimum-access-level internal" | xcbeautify
                  go run ./tools/cmd/ishare-tools docc-symbols build/raw-symbol-graphs build/symbol-graphs
            - name: Build the documentation
              shell: bash
              run: |
                  xcrun docc convert ishare/ishare.docc \
                    --additional-symbol-graph-dir build/symbol-graphs \
                    --fallback-display-name ishare \
                    --fallback-bundle-identifier dev.adrian.ishare \
                    --transform-for-static-hosting \
                    --hosting-base-path docs \
                    --warnings-as-errors \
                    --output-path build/documentation
                  rm -f build/documentation/index.html
                  for page in "" iscuformat httpuploaders responsetemplates linkoptions s3uploaders localdestinations examples writinganuploader uploader; do
                      if [ ! -f "build/documentation/documentation/ishare/$page/index.html" ]; then
                          echo "::error::The documentation has no page at documentation/ishare/$page"
                          exit 1
                      fi
                  done
            - uses: actions/upload-artifact@v7
              with:
                  name: documentation
                  path: build/documentation
                  if-no-files-found: error

    build:
        needs: documentation
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
              working-directory: website
            - run: npm run build
              working-directory: website
            - name: Add the DocC documentation
              uses: actions/download-artifact@v8
              with:
                  name: documentation
                  path: website/dist/docs
            - name: Download the new appcast
              if: inputs.appcast-artifact != ''
              uses: actions/download-artifact@v8
              with:
                  name: ${{ inputs.appcast-artifact }}
                  path: website/dist
            - name: Keep the published appcast
              if: inputs.appcast-artifact == ''
              run: |
                  curl -fsSL -o website/dist/appcast.xml https://ishare.itoolio.dev/appcast.xml \
                    || echo "No published appcast yet"
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v5
              id: deployment
