name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build, sign, notarize and validate without publishing anything
                type: boolean
                default: true
            version:
                description: Version to use for a dry run
                type: string
                default: 5.0.0

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main
    SEMANTIC_RELEASE: >-
        npx --yes
        -p semantic-release@25
        -p @semantic-release/changelog@7
        -p @semantic-release/exec@7
        -p @semantic-release/git@11
        -p conventional-changelog-conventionalcommits@9
        semantic-release

defaults:
    run:
        shell: bash

jobs:
    checks:
        uses: ./.github/workflows/ci.yml

    version:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            version: ${{ steps.next.outputs.version }}
            build-number: ${{ steps.next.outputs.build-number }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - name: Work out the next version
              id: next
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN_VERSION: ${{ inputs.version }}
              run: |
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "version=$DRY_RUN_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    $SEMANTIC_RELEASE --dry-run --no-ci
                    if [ -f .next-version ]; then
                      echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
                    fi
                  fi
                  echo "build-number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

    developer-id:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-26
        timeout-minutes: 90
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: go run ./tools/cmd/ishare-tools set-version ${{ needs.version.outputs.version }}
            - run: xcodegen generate

            - name: Register the bundle IDs
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  BUNDLE_IDENTIFIERS: dev.adrian.ishare,dev.adrian.ishare.sharemenuext,dev.adrian.ishare.widgets
                  BUNDLE_NAME: ishare
              run: go run ./tools/cmd/ishare-tools register-bundle-id

            - name: Fetch Signing Assets
              uses: castdrian/setup-apple-certificate@main
              id: cert
              with:
                  app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  distribution-private-key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
                  bundle-identifier: dev.adrian.ishare
                  certificate-type: DEVELOPER_ID

            - name: Install Signing Assets
              env:
                  P12_FILE_BASE64: ${{ steps.cert.outputs.p12-certificate-base64 }}
                  P12_PASSWORD: ${{ steps.cert.outputs.p12-password }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/ishare-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
                  P12_PATH="$RUNNER_TEMP/ishare-signing.p12"
                  echo "$P12_FILE_BASE64" | base64 --decode > "$P12_PATH"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import "$P12_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -P "$P12_PASSWORD"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
                  rm -f "$P12_PATH"

            - name: Archive and export
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  xcodebuild archive \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -configuration Release \
                    -destination "generic/platform=macOS" \
                    -archivePath build/ishare.xcarchive \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGN_IDENTITY="$IDENTITY" \
                    PROVISIONING_PROFILE_SPECIFIER= \
                    DEVELOPMENT_TEAM=L988J7YMK5 \
                    OTHER_CODE_SIGN_FLAGS=--timestamp | tee "$RUNNER_TEMP/developer-id-archive.log" | xcbeautify
                  xcodebuild -exportArchive \
                    -archivePath build/ishare.xcarchive \
                    -exportOptionsPlist ExportOptions-DeveloperID.plist \
                    -exportPath build/export | xcbeautify
                  codesign --verify --deep --strict --verbose=2 build/export/ishare.app
                  go run ./tools/cmd/ishare-tools build-warnings \
                    "$RUNNER_TEMP/developer-id-archive.log"

            - name: Package the dSYMs
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: go run ./tools/cmd/ishare-tools package-dsyms build/ishare.xcarchive "build/dsyms/ishare-$VERSION-dSYMs.zip"

            - uses: actions/upload-artifact@v7
              with:
                  name: dsyms
                  path: build/dsyms/*.zip
                  if-no-files-found: error

            - name: Generate the SBOM
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  RESOLVED=ishare.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
                  if [ ! -f "$RESOLVED" ]; then
                      RESOLVED="$(find build "$HOME/Library/Developer/Xcode/DerivedData" -name Package.resolved -path "*swiftpm*" -print -quit 2>/dev/null || true)"
                  fi
                  if [ -z "$RESOLVED" ] || [ ! -f "$RESOLVED" ]; then
                      echo "::error::The archive did not leave a Package.resolved behind"
                      exit 1
                  fi
                  echo "Using $RESOLVED"
                  SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" go run ./tools/cmd/ishare-tools sbom \
                    --version "$VERSION" \
                    --package-resolved "$RESOLVED" \
                    --package-dir Packages/ishareCore \
                    --go-mod tools/go.mod \
                    --output "build/sbom/ishare-$VERSION-sbom.spdx.json"

            - uses: actions/upload-artifact@v7
              with:
                  name: sbom
                  path: build/sbom/*.spdx.json
                  if-no-files-found: error

            - name: Notarize and staple app
              env:
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  KEY="$RUNNER_TEMP/notary_key.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  /usr/bin/ditto -c -k --keepParent build/export/ishare.app build/notarize.zip
                  xcrun notarytool submit build/notarize.zip \
                    --key "$KEY" \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple build/export/ishare.app

            - name: Package, notarize and staple DMG
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  KEY="$RUNNER_TEMP/notary_key.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  mkdir -p dist build/dmg
                  cp -R build/export/ishare.app build/dmg/
                  ln -s /Applications build/dmg/Applications
                  hdiutil create -volname "ishare" -srcfolder build/dmg -ov -format UDZO dist/ishare.dmg
                  codesign --force --timestamp --sign "$IDENTITY" dist/ishare.dmg
                  xcrun notarytool submit dist/ishare.dmg \
                    --key "$KEY" \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple dist/ishare.dmg
                  spctl -a -vv -t open --context context:primary-signature dist/ishare.dmg

            - uses: actions/upload-artifact@v7
              with:
                  name: dmg
                  path: dist/ishare.dmg

            - name: Attest the build provenance of the DMG, the dSYMs and the SBOM
              if: env.DRY_RUN != 'true'
              uses: actions/attest-build-provenance@v3
              with:
                  subject-path: |
                      dist/ishare.dmg
                      build/dsyms/*.zip
                      build/sbom/*.spdx.json

            - name: Remove Signing Assets
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/ishare-signing.keychain-db" || true

    app-store:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-26
        timeout-minutes: 90
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: go run ./tools/cmd/ishare-tools set-version ${{ needs.version.outputs.version }}
            - run: xcodegen generate

            - name: Register the bundle IDs
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  BUNDLE_IDENTIFIERS: dev.adrian.ishare,dev.adrian.ishare.sharemenuext,dev.adrian.ishare.widgets
                  BUNDLE_NAME: ishare
              run: go run ./tools/cmd/ishare-tools register-bundle-id

            - name: Archive, sign in the cloud and upload
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  mkdir -p "$HOME/.appstoreconnect/private_keys"
                  KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
                  xcodebuild archive \
                    -project ishare.xcodeproj \
                    -scheme ishare \
                    -configuration Release \
                    -destination "generic/platform=macOS" \
                    -archivePath build/ishare-appstore.xcarchive \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGN_IDENTITY=- \
                    PROVISIONING_PROFILE_SPECIFIER= \
                    DEVELOPMENT_TEAM=L988J7YMK5 | tee "$RUNNER_TEMP/app-store-archive.log" | xcbeautify
                  go run ./tools/cmd/ishare-tools build-warnings \
                    "$RUNNER_TEMP/app-store-archive.log"
                  OPTIONS=ExportOptions-AppStore.plist
                  if [ "$DRY_RUN" = "true" ]; then
                    sed 's#<string>upload</string>#<string>export</string>#' ExportOptions-AppStore.plist > build/ExportOptions-validate.plist
                    OPTIONS=build/ExportOptions-validate.plist
                  fi
                  xcodebuild -exportArchive \
                    -archivePath build/ishare-appstore.xcarchive \
                    -exportOptionsPlist "$OPTIONS" \
                    -exportPath build/appstore \
                    "${AUTH[@]}" | xcbeautify
                  if [ "$DRY_RUN" = "true" ]; then
                    xcrun altool --validate-app -f build/appstore/ishare.pkg -t macos --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
                  fi
                  ditto -c -k --keepParent build/ishare-appstore.xcarchive/Products/Applications/ishare.app build/ishare.app.zip
            - uses: actions/upload-artifact@v7
              with:
                  name: app-store-app
                  path: build/ishare.app.zip

            - name: Package the dSYMs
              env:
                  VERSION: ${{ needs.version.outputs.version }}
              run: go run ./tools/cmd/ishare-tools package-dsyms build/ishare-appstore.xcarchive "build/dsyms/ishare-$VERSION-AppStore-dSYMs.zip"

            - uses: actions/upload-artifact@v7
              with:
                  name: app-store-dsyms
                  path: build/dsyms/*.zip
                  if-no-files-found: error

            - name: Attest the build provenance of the App Store dSYMs
              if: env.DRY_RUN != 'true'
              uses: actions/attest-build-provenance@v3
              with:
                  subject-path: build/dsyms/*.zip

    publish:
        needs: [checks, version, developer-id, app-store]
        if: github.event_name == 'push'
        runs-on: ubuntu-24.04
        outputs:
            tag: ${{ steps.release.outputs.tag }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - uses: actions/download-artifact@v8
              with:
                  name: dmg
                  path: dist
            - uses: actions/download-artifact@v8
              with:
                  name: dsyms
                  path: dist
            - uses: actions/download-artifact@v8
              with:
                  name: app-store-dsyms
                  path: dist
            - uses: actions/download-artifact@v8
              with:
                  name: sbom
                  path: dist
            - name: List the release assets
              run: ls -l dist
            - name: Publish the release
              id: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: |
                  $SEMANTIC_RELEASE
                  echo "tag=v${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

    update-feed:
        needs: [version, publish]
        uses: ./.github/workflows/update-feed.yml
        with:
            tag: ${{ needs.publish.outputs.tag }}
        secrets:
            EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
        permissions:
            contents: read
            pages: write
            id-token: write

    release-check:
        needs: [version, publish, app-store]
        uses: ./.github/workflows/release-check.yml
        with:
            tag: ${{ needs.publish.outputs.tag }}
            app-artifact: app-store-app
        secrets: inherit

    app-store-sync:
        needs: [version, release-check]
        uses: ./.github/workflows/app-store-sync.yml
        with:
            wait-for-version: ${{ needs.version.outputs.version }}
        permissions:
            contents: read
            issues: write
        secrets: inherit
