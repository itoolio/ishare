name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            dry_run:
                description: Build, sign, notarize and validate without publishing anything
                type: boolean
                default: true
            version:
                description: Version to use for a dry run
                type: string
                default: 5.0.0

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    GIT_CONFIG_COUNT: 1
    GIT_CONFIG_KEY_0: init.defaultBranch
    GIT_CONFIG_VALUE_0: main
    SEMANTIC_RELEASE: >-
        npx --yes
        -p semantic-release@25
        -p @semantic-release/changelog@7
        -p @semantic-release/exec@7
        -p @semantic-release/git@11
        -p conventional-changelog-conventionalcommits@9
        semantic-release

jobs:
    checks:
        uses: ./.github/workflows/ci.yml

    version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.next.outputs.version }}
            build-number: ${{ steps.next.outputs.build-number }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - name: Work out the next version
              id: next
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN_VERSION: ${{ inputs.version }}
              run: |
                  if [ "$DRY_RUN" = "true" ]; then
                    echo "version=$DRY_RUN_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    $SEMANTIC_RELEASE --dry-run --no-ci
                    if [ -f .next-version ]; then
                      echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
                    fi
                  fi
                  echo "build-number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

    developer-id:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-26
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: go run ./tools/cmd/ishare-tools set-version ${{ needs.version.outputs.version }}
            - run: xcodegen generate

            - name: Register the bundle IDs
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  BUNDLE_IDENTIFIERS: dev.adrian.ishare,dev.adrian.ishare.sharemenuext
                  BUNDLE_NAME: ishare
              run: go run ./tools/cmd/ishare-tools register-bundle-id

            - name: Fetch Signing Assets
              uses: castdrian/setup-apple-certificate@main
              id: cert
              with:
                  app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  distribution-private-key: ${{ secrets.DISTRIBUTION_PRIVATE_KEY_BASE64 }}
                  bundle-identifier: dev.adrian.ishare
                  certificate-type: DEVELOPER_ID

            - name: Install Signing Assets
              env:
                  P12_FILE_BASE64: ${{ steps.cert.outputs.p12-certificate-base64 }}
                  P12_PASSWORD: ${{ steps.cert.outputs.p12-password }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/ishare-signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
                  P12_PATH="$RUNNER_TEMP/ishare-signing.p12"
                  echo "$P12_FILE_BASE64" | base64 --decode > "$P12_PATH"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import "$P12_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -P "$P12_PASSWORD"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
                  rm -f "$P12_PATH"

            - name: Archive and export
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
              run: |
                  xcodebuild archive \
                    -project ishare.xcodeproj \
                    -scheme GitHub \
                    -configuration Release \
                    -destination "generic/platform=macOS" \
                    -archivePath build/ishare.xcarchive \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGN_IDENTITY="$IDENTITY" \
                    PROVISIONING_PROFILE_SPECIFIER= \
                    DEVELOPMENT_TEAM=L988J7YMK5 \
                    OTHER_CODE_SIGN_FLAGS=--timestamp | xcbeautify
                  xcodebuild -exportArchive \
                    -archivePath build/ishare.xcarchive \
                    -exportOptionsPlist ExportOptions-DeveloperID.plist \
                    -exportPath build/export | xcbeautify
                  codesign --verify --deep --strict --verbose=2 build/export/ishare.app

            - name: Notarize and staple app
              env:
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  KEY="$RUNNER_TEMP/notary_key.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  /usr/bin/ditto -c -k --keepParent build/export/ishare.app build/notarize.zip
                  xcrun notarytool submit build/notarize.zip \
                    --key "$KEY" \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple build/export/ishare.app

            - name: Package, notarize and staple DMG
              env:
                  IDENTITY: ${{ steps.cert.outputs.codesign-identity }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  KEY="$RUNNER_TEMP/notary_key.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  mkdir -p dist build/dmg
                  cp -R build/export/ishare.app build/dmg/
                  ln -s /Applications build/dmg/Applications
                  hdiutil create -volname "ishare" -srcfolder build/dmg -ov -format UDZO dist/ishare.dmg
                  codesign --force --timestamp --sign "$IDENTITY" dist/ishare.dmg
                  xcrun notarytool submit dist/ishare.dmg \
                    --key "$KEY" \
                    --key-id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                    --issuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                    --wait
                  xcrun stapler staple dist/ishare.dmg
                  spctl -a -vv -t open --context context:primary-signature dist/ishare.dmg

            - uses: actions/upload-artifact@v7
              with:
                  name: dmg
                  path: dist/ishare.dmg

            - name: Remove Signing Assets
              if: always()
              run: security delete-keychain "$RUNNER_TEMP/ishare-signing.keychain-db" || true

    app-store:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-26
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: go run ./tools/cmd/ishare-tools set-version ${{ needs.version.outputs.version }}
            - run: xcodegen generate

            - name: Archive, sign in the cloud and upload
              env:
                  KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
              run: |
                  mkdir -p "$HOME/.appstoreconnect/private_keys"
                  KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
                  trap 'rm -f "$KEY"' EXIT
                  echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
                  AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
                  xcodebuild archive \
                    -project ishare.xcodeproj \
                    -scheme ishare \
                    -configuration Release \
                    -destination "generic/platform=macOS" \
                    -archivePath build/ishare-appstore.xcarchive \
                    CODE_SIGN_STYLE=Manual \
                    CODE_SIGN_IDENTITY=- \
                    PROVISIONING_PROFILE_SPECIFIER= \
                    DEVELOPMENT_TEAM=L988J7YMK5 | xcbeautify
                  OPTIONS=ExportOptions-AppStore.plist
                  if [ "$DRY_RUN" = "true" ]; then
                    sed 's#<string>upload</string>#<string>export</string>#' ExportOptions-AppStore.plist > build/ExportOptions-validate.plist
                    OPTIONS=build/ExportOptions-validate.plist
                  fi
                  xcodebuild -exportArchive \
                    -archivePath build/ishare-appstore.xcarchive \
                    -exportOptionsPlist "$OPTIONS" \
                    -exportPath build/appstore \
                    "${AUTH[@]}" | xcbeautify
                  if [ "$DRY_RUN" = "true" ]; then
                    xcrun altool --validate-app -f build/appstore/ishare.pkg -t macos --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
                  fi
                  ditto -c -k --keepParent build/ishare-appstore.xcarchive/Products/Applications/ishare.app build/ishare.app.zip
            - uses: actions/upload-artifact@v7
              with:
                  name: app-store-app
                  path: build/ishare.app.zip

    publish:
        needs: [checks, version, developer-id, app-store]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.release.outputs.tag }}
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: actions/setup-node@v7
              with:
                  node-version: lts/*
            - uses: actions/download-artifact@v8
              with:
                  name: dmg
                  path: dist
            - name: Publish the release
              id: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: |
                  $SEMANTIC_RELEASE
                  echo "tag=v${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

    appcast:
        needs: [version, publish]
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  name: dmg
                  path: update
            - name: Render release notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.publish.outputs.tag }}
              run: |
                  gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > RELEASE.md
                  gh api markdown -f text="$(cat RELEASE.md)" -f mode=gfm -f context="$GITHUB_REPOSITORY" > update/ishare.html
            - name: Generate appcast.xml
              env:
                  EDDSA_PRIVATE_KEY: ${{ secrets.EDDSA_PRIVATE_KEY }}
              run: |
                  curl -fsSL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
                  mkdir sparkle && tar -xJf sparkle.tar.xz -C sparkle
                  echo "$EDDSA_PRIVATE_KEY" | ./sparkle/bin/generate_appcast \
                    --ed-key-file - \
                    --link https://ishare.itoolio.dev \
                    --embed-release-notes \
                    --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/" \
                    update/
            - uses: actions/upload-artifact@v7
              with:
                  name: appcast
                  path: update/appcast.xml

    release-check:
        needs: [version, publish, app-store]
        uses: ./.github/workflows/release-check.yml
        with:
            tag: ${{ needs.publish.outputs.tag }}
            app-artifact: app-store-app
        secrets: inherit

    app-store-submit:
        needs: [version, publish, release-check]
        runs-on: macos-26
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.publish.outputs.tag }}
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.4"
                  bundler-cache: true
            - name: Install XcodeGen
              run: brew install xcodegen
            - name: Write the App Store release notes
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.publish.outputs.tag }}
              run: |
                  gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                    | go run ./tools/cmd/ishare-tools release-notes fastlane/metadata/en-US/release_notes.txt
                  cat fastlane/metadata/en-US/release_notes.txt
            - name: Check the committed screenshots
              run: test "$(find fastlane/screenshots -name '*.jpg' | wc -l)" -ge 1
            - name: Submit to the App Store
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
                  REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
                  REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
                  REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
                  LC_ALL: en_US.UTF-8
                  LANG: en_US.UTF-8
              run: bundle exec fastlane mac release version:${{ needs.version.outputs.version }} build:${{ needs.version.outputs.build-number }}

    pages:
        needs: [appcast]
        uses: ./.github/workflows/pages.yml
        with:
            appcast-artifact: appcast
        permissions:
            contents: read
            pages: write
            id-token: write
