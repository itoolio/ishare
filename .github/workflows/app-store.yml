name: App Store

on:
    workflow_dispatch:
        inputs:
            version:
                description: App Store version to update, for example 5.1.0
                required: true
            build:
                description: Build number to submit with metadata and release notes; leave empty to only replace screenshots
                required: false
                default: ""
            submit:
                description: Upload the committed screenshots and submit the version for review
                type: boolean
                default: true
            regenerate_screenshots:
                description: Render new screenshots on a virtual HiDPI display and commit them to dev instead of submitting
                type: boolean
                default: false
            locales:
                description: Locales to render when regenerating, all for every App Store locale or a list such as en-US de-DE
                type: string
                default: all

permissions:
    contents: read

jobs:
    regenerate-screenshots:
        if: inputs.regenerate_screenshots
        runs-on: macos-26
        timeout-minutes: 180
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.REPO_ACCESS_TOKEN }}
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - name: Render the screenshots of every locale on a 1680x1050 point HiDPI virtual display
              env:
                  LOCALES: ${{ inputs.locales }}
              run: |
                  read -ra locales <<< "$LOCALES"
                  go run ./tools/cmd/ishare-tools screenshots --ci "${locales[@]}"
            - name: Check the rendered screenshots
              run: go run ./tools/cmd/ishare-tools release-check
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: screenshots
                  path: fastlane/screenshots
            - name: Commit the screenshots to dev
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch -q origin dev
                  git checkout -q -B dev origin/dev
                  for file in fastlane/screenshots/en-US/*.jpg; do
                      sips -Z 1600 -s formatOptions 82 "$file" --out "website/public/screenshots/$(basename "$file")" >/dev/null
                  done
                  git add fastlane/screenshots website/public/screenshots
                  if git diff --cached --quiet; then
                      echo "The screenshots did not change."
                      exit 0
                  fi
                  git commit -q -m "docs: regenerate the screenshots for $VERSION"
                  git push -q origin HEAD:dev

    screenshots:
        if: ${{ !inputs.regenerate_screenshots }}
        runs-on: macos-26
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.4"
                  bundler-cache: true
            - name: Check the committed screenshots and metadata of every locale
              run: go run ./tools/cmd/ishare-tools release-check
            - name: Write the App Store release notes
              if: inputs.submit && inputs.build != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ inputs.version }}
              run: |
                  gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                    | go run ./tools/cmd/ishare-tools release-notes fastlane/metadata/en-US/release_notes.txt
            - name: Localize the App Store metadata and release notes
              if: inputs.submit && inputs.build != ''
              run: go run ./tools/cmd/ishare-tools metadata
            - name: Submit the version with metadata and release notes
              if: inputs.submit && inputs.build != ''
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
                  REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
                  REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
                  REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
                  VERSION: ${{ inputs.version }}
                  BUILD: ${{ inputs.build }}
                  LC_ALL: en_US.UTF-8
                  LANG: en_US.UTF-8
              run: bundle exec fastlane mac release version:"$VERSION" build:"$BUILD"
            - name: Replace the App Store screenshots
              if: inputs.submit && inputs.build == ''
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
                  REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
                  REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
                  REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
                  VERSION: ${{ inputs.version }}
                  LC_ALL: en_US.UTF-8
                  LANG: en_US.UTF-8
              run: bundle exec fastlane mac screenshots version:"$VERSION"
