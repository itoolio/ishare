name: App Store

on:
    workflow_dispatch:
        inputs:
            version:
                description: App Store version to update, for example 5.1.0
                required: true
            build:
                description: Build number to submit with metadata and release notes; leave empty to only replace screenshots
                required: false
                default: ""
            submit:
                description: Upload the committed screenshots and submit the version for review
                type: boolean
                default: true
            regenerate_screenshots:
                description: Render new screenshots on a virtual HiDPI display and open a pull request with them instead of submitting
                type: boolean
                default: false
            locales:
                description: Locales to render when regenerating, for example en-US de-DE:de
                type: string
                default: en-US

permissions:
    contents: read

jobs:
    regenerate-screenshots:
        if: inputs.regenerate_screenshots
        runs-on: macos-26
        timeout-minutes: 60
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Install XcodeGen
              run: brew install xcodegen
            - name: Render the screenshots on a 1680x1050 point HiDPI virtual display
              env:
                  LOCALES: ${{ inputs.locales }}
              run: go run ./tools/cmd/ishare-tools screenshots --ci $LOCALES
            - name: Check the rendered screenshots
              run: go run ./tools/cmd/ishare-tools release-check
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: screenshots
                  path: fastlane/screenshots
            - uses: peter-evans/create-pull-request@v7
              with:
                  branch: screenshots/${{ inputs.version }}
                  title: "chore(app-store): regenerate the App Store screenshots for ${{ inputs.version }}"
                  commit-message: "chore(app-store): regenerate the App Store screenshots"
                  body: Screenshots rendered by the App Store workflow on a HiDPI virtual display. Review them before merging; the next submission uploads whatever is committed.
                  add-paths: fastlane/screenshots

    screenshots:
        if: ${{ !inputs.regenerate_screenshots }}
        runs-on: macos-26
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.4"
                  bundler-cache: true
            - name: Check the committed screenshots
              run: test "$(find fastlane/screenshots -name '*.jpg' | wc -l)" -ge 1
            - name: Write the App Store release notes
              if: inputs.submit && inputs.build != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ inputs.version }}
              run: |
                  gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                    | go run ./tools/cmd/ishare-tools release-notes fastlane/metadata/en-US/release_notes.txt
            - name: Submit the version with metadata and release notes
              if: inputs.submit && inputs.build != ''
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
                  REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
                  REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
                  REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
                  VERSION: ${{ inputs.version }}
                  BUILD: ${{ inputs.build }}
                  LC_ALL: en_US.UTF-8
                  LANG: en_US.UTF-8
              run: bundle exec fastlane mac release version:"$VERSION" build:"$BUILD"
            - name: Replace the App Store screenshots
              if: inputs.submit && inputs.build == ''
              env:
                  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
                  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
                  APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
                  REVIEW_CONTACT_FIRST_NAME: ${{ secrets.REVIEW_CONTACT_FIRST_NAME }}
                  REVIEW_CONTACT_LAST_NAME: ${{ secrets.REVIEW_CONTACT_LAST_NAME }}
                  REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
                  REVIEW_CONTACT_PHONE: ${{ secrets.REVIEW_CONTACT_PHONE }}
                  VERSION: ${{ inputs.version }}
                  LC_ALL: en_US.UTF-8
                  LANG: en_US.UTF-8
              run: bundle exec fastlane mac screenshots version:"$VERSION"
