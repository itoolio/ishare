name: Merge Crowdin translations

on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: crowdin-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    merge:
        if: >-
            github.event.pull_request.head.ref == 'l10n_main' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-26.04
        env:
            GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            CATALOGS: ishare/Localizable.xcstrings fastlane/metadata/Metadata.xcstrings
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base
                  persist-credentials: false
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: head
                  token: ${{ secrets.REPO_ACCESS_TOKEN }}
            - name: Skip the merge commit this workflow pushed
              id: own
              working-directory: head
              run: |
                  if git log -1 --format=%s | grep -q '^fix(i18n): add .* translations from Crowdin'; then
                    echo "skip=1" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/setup-go@v7
              if: steps.own.outputs.skip != '1'
              with:
                  go-version-file: base/tools/go.mod
                  cache-dependency-path: base/tools/go.mod
            - name: Keep only new translations
              id: merge
              if: steps.own.outputs.skip != '1'
              working-directory: base
              run: |
                  set -o pipefail
                  TOTAL=0
                  LANGUAGES=""
                  for CATALOG in $CATALOGS; do
                      [ -f "$CATALOG" ] || continue
                      MERGED="../merged/$CATALOG"
                      mkdir -p "$(dirname "$MERGED")"
                      if [ ! -f "../head/$CATALOG" ]; then
                          cp "$CATALOG" "$MERGED"
                          continue
                      fi
                      SUMMARY=$(go run ./tools/cmd/ishare-tools merge-translations "$CATALOG" "../head/$CATALOG" "$MERGED")
                      echo "$CATALOG: $SUMMARY" | tr '\n' ' '
                      echo
                      TOTAL=$((TOTAL + $(echo "$SUMMARY" | sed -n 's/^added=//p')))
                      LANGUAGES="$LANGUAGES,$(echo "$SUMMARY" | sed -n 's/^languages=//p')"
                  done
                  LANGUAGES=$(echo "$LANGUAGES" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)
                  echo "added=$TOTAL" >> "$GITHUB_OUTPUT"
                  echo "languages=$LANGUAGES" >> "$GITHUB_OUTPUT"
            - name: Close pull request without new translations
              if: steps.own.outputs.skip != '1' && steps.merge.outputs.added == '0'
              run: >-
                  gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch
                  --comment "Crowdin exported no new translations (only empty strings, English copies or values the repository already has), so this pull request was closed. Crowdin opens a new one when a translation is submitted."
            - name: Commit the merged catalog on top of the base branch
              if: steps.own.outputs.skip != '1' && steps.merge.outputs.added != '0'
              working-directory: head
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  ADDED: ${{ steps.merge.outputs.added }}
                  LANGUAGES: ${{ steps.merge.outputs.languages }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch -q origin "$BASE_SHA"
                  git read-tree --reset -u "$BASE_SHA"
                  for CATALOG in $CATALOGS; do
                      if [ -f "../merged/$CATALOG" ]; then cp "../merged/$CATALOG" "$CATALOG"; fi
                  done
                  if [ -f fastlane/metadata/Metadata.xcstrings ]; then
                      (cd ../base && go run ./tools/cmd/ishare-tools metadata --metadata "$GITHUB_WORKSPACE/head/fastlane/metadata")
                  fi
                  git add -A
                  git commit -q -m "fix(i18n): add $ADDED translations from Crowdin ($LANGUAGES)"
                  git push -q origin "HEAD:$HEAD_REF"
            - name: Merge automatically
              if: steps.own.outputs.skip != '1' && steps.merge.outputs.added != '0'
              run: >-
                  gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
                  --subject "fix(i18n): update translations from Crowdin"
