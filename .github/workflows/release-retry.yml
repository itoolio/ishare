name: Release retry

on:
    workflow_run:
        workflows: [Release]
        types: [completed]

permissions:
    contents: read

jobs:
    retry:
        if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
        runs-on: ubuntu-24.04
        permissions:
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: tools/go.mod
                  cache-dependency-path: tools/go.mod
            - name: Decide whether the release lost a runner
              id: decision
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
                    | go run ./tools/cmd/ishare-tools release-retry --attempt "$ATTEMPT" | tee "$RUNNER_TEMP/decision.txt"
                  cat "$RUNNER_TEMP/decision.txt" >> "$GITHUB_OUTPUT"
            - name: Rerun the failed jobs
              if: steps.decision.outputs.retry == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
              run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
