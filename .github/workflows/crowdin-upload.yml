name: Upload translations to Crowdin

on:
    push:
        branches: [main]
        paths:
            - ishare/Localizable.xcstrings
            - fastlane/metadata/Metadata.xcstrings
            - crowdin.yml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: crowdin-upload
    cancel-in-progress: false

jobs:
    upload:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            !startsWith(github.event.head_commit.message, 'fix(i18n): update translations from Crowdin')
        runs-on: ubuntu-24.04
        env:
            CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
            CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        steps:
            - name: Check the Crowdin credentials
              id: credentials
              run: |
                  if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
                    echo "::notice title=Crowdin upload skipped::Add the CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN repository secrets to upload the repository's strings and translations to Crowdin."
                    echo "available=0" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=1" >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/checkout@v7
              if: steps.credentials.outputs.available == '1'
            - name: Upload the sources and translations
              if: steps.credentials.outputs.available == '1'
              uses: crowdin/github-action@v2
              with:
                  config: crowdin.yml
                  upload_sources: true
                  upload_translations: true
                  import_eq_suggestions: true
                  auto_approve_imported: true
                  download_translations: false
                  push_translations: false
                  create_pull_request: false
