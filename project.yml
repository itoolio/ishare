name: ishare
options:
  bundleIdPrefix: dev.adrian
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: L988J7YMK5
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: YES
    SWIFT_UPCOMING_FEATURE_DEPRECATE_APPLICATION_MAIN: YES
    SWIFT_UPCOMING_FEATURE_DISABLE_OUTWARD_ACTOR_ISOLATION: YES
    SWIFT_UPCOMING_FEATURE_FORWARD_TRAILING_CLOSURES: YES
    SWIFT_UPCOMING_FEATURE_GLOBAL_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_IMPLICIT_OPEN_EXISTENTIALS: YES
    SWIFT_UPCOMING_FEATURE_IMPORT_OBJC_FORWARD_DECLS: YES
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.10.2
  SwiftyJSON:
    url: https://github.com/SwiftyJSON/SwiftyJSON
    from: 5.0.2
  BezelNotification:
    url: https://github.com/BlueHuskyStudios/BezelNotification
    from: 2.1.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.2.0
  SettingsAccess:
    url: https://github.com/orchetect/SettingsAccess
    from: 1.4.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.3
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.2
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
targetTemplates:
  ishareApp:
    type: application
    platform: macOS
    sources:
      - path: ishare
        excludes:
          - "**/*.entitlements"
          - "**/Info*.plist"
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: Alamofire
      - package: SwiftyJSON
      - package: BezelNotification
      - package: MenuBarExtraAccess
      - package: SettingsAccess
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - target: sharemenuext
        embed: true
        codeSign: true
      - target: ishareWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: ishare
        PRODUCT_MODULE_NAME: ishare
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ishare
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Adrian Castro"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ishare requires access to your microphone if you wish to record it
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: ishare captures your screen to create screenshots and recordings
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        REGISTER_APP_GROUPS: YES
targets:
  ishare:
    templates:
      - ishareApp
    settings:
      base:
        INFOPLIST_FILE: ishare/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(ISHARE_APP_STORE_ENTITLEMENTS:default=ishare/ishare.entitlements)
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG APP_STORE
  ishare - GitHub:
    templates:
      - ishareApp
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: ishare/Info-GitHub.plist
        CODE_SIGN_ENTITLEMENTS: ishare/ishare-github.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GITHUB_RELEASE
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GITHUB_RELEASE
  sharemenuext:
    type: app-extension
    platform: macOS
    sources:
      - path: sharemenuext
        excludes:
          - "**/*.entitlements"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare.sharemenuext
        INFOPLIST_FILE: sharemenuext/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ishare
        CODE_SIGN_ENTITLEMENTS: sharemenuext/sharemenuext.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readonly
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
  ishareWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ishareWidgets
        excludes:
          - "**/*.entitlements"
          - Info.plist
      - path: ishare/Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: ishareWidgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare.widgets
        INFOPLIST_FILE: ishareWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ishare
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Adrian Castro"
        CODE_SIGN_ENTITLEMENTS: ishareWidgets/ishareWidgets.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
  ishareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ishareTests
        excludes:
          - Snapshots
          - "**/*.entitlements"
    dependencies:
      - target: ishare - GitHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ishare.app/Contents/MacOS/ishare
        BUNDLE_LOADER: $(TEST_HOST)
  ishareAppStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ishareTests
        excludes:
          - Snapshots
          - "**/*.entitlements"
      - path: examples
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Fixtures
      - path: ishare
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Fixtures
    dependencies:
      - target: ishare
    settings:
      base:
        PRODUCT_NAME: ishareAppStoreTests
        PRODUCT_MODULE_NAME: ishareAppStoreTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare.appstoretests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ishare.app/Contents/MacOS/ishare
        BUNDLE_LOADER: $(TEST_HOST)
  ishareUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ishareUITests
    dependencies:
      - target: ishare - GitHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adrian.ishare.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ishare - GitHub
schemes:
  ishare:
    build:
      targets:
        ishare: all
    run:
      config: Debug
    archive:
      config: Release
  GitHub:
    build:
      targets:
        ishare - GitHub: all
        ishareTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ishareTests
    archive:
      config: Release
  AppStoreTests:
    build:
      targets:
        ishare: all
        ishareAppStoreTests: [test]
    test:
      config: Debug
      targets:
        - ishareAppStoreTests
  Screenshots:
    build:
      targets:
        ishare - GitHub: all
        ishareUITests: [test]
    test:
      config: Debug
      targets:
        - name: ishareUITests
          selectedTests:
            - ScreenshotTests
  UITests:
    build:
      targets:
        ishare - GitHub: all
        ishareUITests: [test]
    test:
      config: Debug
      targets:
        - name: ishareUITests
          skippedTests:
            - ScreenshotTests
